name: Build and test
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set build directory
        run: echo "BOOKSHELF_BUILD_ROOT=$RUNNER_TEMP/Bookshelf" >> "$GITHUB_ENV"
      - name: Run release tooling tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Run XCTest
        run: bash scripts/verify-project.sh
      - name: Build unsigned universal application
        run: bash scripts/build-release.sh
      - name: Check updater integration
        run: python3 scripts/check-update-config.py --app "$BOOKSHELF_BUILD_ROOT/ReleaseCheck/Build/Products/Release/Bookshelf.app"
